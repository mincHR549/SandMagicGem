plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '7.1.2'
}

group       = 'cn.sandtripper.minecraft'
version     = '1.1'
description = '魔术宝石'

def targetJavaVersion = 8
java {
    sourceCompatibility = JavaVersion.toVersion(targetJavaVersion)
    targetCompatibility = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < JavaVersion.toVersion(targetJavaVersion)) {
        toolchain {
            languageVersion = JavaLanguageVersion.of(targetJavaVersion)
        }
    }
}

repositories {
    mavenCentral()

    // 强制把 Mojang 的 authlib 当成 artifact-only 来拉
    maven {
        name = 'mojang-libs'
        url  = 'https://libraries.minecraft.net/'
        content {
            includeGroup 'com.mojang'
        }
        // 跳过 maven-metadata.xml，直接通过 jar 路径解析
        metadataSources {
            artifact()
        }
    }

    maven {
        name = 'spigotmc-repo'
        url  = 'https://hub.spigotmc.org/nexus/content/repositories/snapshots/'
    }
    maven {
        name = 'sonatype'
        url  = 'https://oss.sonatype.org/content/groups/public/'
    }
}


dependencies {
    compileOnly 'org.spigotmc:spigot-api:1.20.1-R0.1-SNAPSHOT'
    compileOnly 'com.mojang:authlib:4.0.43'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    filteringCharset = 'UTF-8'
    inputs.property 'version', version
    filesMatching('plugin.yml') {
        expand(
                project: project,      // 整个 project 对象，支持 ${project.version}, ${project.name}…
                version: version       // 或者单独传 version，支持 ${version}
        )
    }
}


shadowJar {
    relocate 'org.bstats', 'cn.sandtripper.minecraft.sandmagicgem'
    archiveClassifier.set('')
}
